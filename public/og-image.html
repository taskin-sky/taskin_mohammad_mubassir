<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>OG Image Generator</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
      }
      .content {
        text-align: center;
        padding: 40px;
      }
      h1 {
        font-size: 64px;
        margin-bottom: 20px;
      }
      p {
        font-size: 28px;
        opacity: 0.9;
      }
      .logo {
        font-size: 80px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div class="logo">🚀</div>
      <h1>Taskin Mubassir</h1>
      <p>MERN Stack Developer | CSE Graduate</p>
    </div>
  </body>
</html>
